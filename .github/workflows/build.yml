name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
  generate:
    name: go generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check go generate
        run: ./.github/scripts/gogenerate.sh
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Set up gotestfmt
        uses: GoTestTools/gotestfmt-action@v2.3.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Run go test
        run: |
          set -euo pipefail
          go test -v ./... -json 2>&1 | tee /tmp/gotest.log | gotestfmt
      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-log
          path: /tmp/gotest.log
          if-no-files-found: error
  goreleaser:
    name: Release
    needs:
      - test
      - golangci-lint
      - generate
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Import GPG key
        id: import_gpg
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo -e "${GPG_PRIVATE_KEY}" | gpg --import --batch --no-tty
          if [ -n "${PASSPHRASE}" ]; then
            echo "" > /tmp/test.txt
            gpg --detach-sig --yes -v --output=/dev/null --pinentry-mode loopback --passphrase "${PASSPHRASE}" /tmp/test.txt
            rm /tmp/test.txt
          fi
          echo "::set-output name=fingerprint::$(gpg --with-colons --list-keys | awk -F: '/^pub/ { print $5 }')"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSWORD: ${{ secrets.PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: build --snapshot
